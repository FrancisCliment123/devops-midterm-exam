AWSTemplateFormatVersion: '2010-09-09'
Description: Mock OpenAI API infrastructure

Parameters:
  KeyName:
    Type: String
    Description: SSH key pair name

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow web traffic
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
# FIX: Added ingress for port 8080 since Mock API is exposed there
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
# FIX: Added SSH ingress (port 22) required for Ansible connection
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3a.small
      ImageId: ami-0e9085e60087ce171
# FIX: Associated the KeyName parameter so Ansible can connect using the SSH private key
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref WebSecurityGroup

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref WebServer
# FIX: Added PublicIp output as it is required to populate the Ansible inventory.ini
  PublicIp:
    Description: EC2 Public IP Address
    Value: !GetAtt WebServer.PublicIp
